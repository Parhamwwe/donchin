name: Donchian Signal Bot

on:
  schedule:
    # هر ساعت، دقیقه‌ی دوم — باعث می‌شه کندل ساعتی/۴ساعتی بایننس کاملاً بسته شده باشه
    - cron: "2 * * * *"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions برای تست

permissions:
  contents: write   # برای اینکه بتونه state.json رو دوباره کامیت کنه

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python donchian_signal_bot.py

      - name: Commit updated state file
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update signal state [skip ci]"
          git push
